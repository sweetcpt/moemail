name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build Pages
        run: pnpm run build:pages
      - name: Deploy Pages only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MOEMAIL_PAGES_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c4f87d7982b0647922d4218e021a30c1
        run: pnpm exec wrangler pages deploy .vercel/output/static --project-name moemail --branch main
